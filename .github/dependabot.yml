version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: main
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    ignore:
      # Must match the vitest bundled in vite-plus
      - dependency-name: '@vitest/coverage-istanbul'
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    target-branch: main
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']

  - package-ecosystem: devcontainers
    directory: /
    target-branch: main
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      devcontainers:
        patterns: ['*']
